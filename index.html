<!DOCTYPE html>
<html lang="en" class="transition-colors duration-300 ease-in-out">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal Popup Window</title>
  <link rel="stylesheet" href="./dist/output.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[linear-gradient(145deg,#e0e0e0,#f0f0f0)] transition-[background] duration-300 ease-in-out dark:bg-[linear-gradient(145deg,#1a1a1a,#2a2a2a)]">
  <button
    id="themeToggle"
    type="button"
    class="theme-toggle clay-button fixed top-4 right-4 z-40 flex h-12 w-12 items-center justify-center rounded-2xl text-xl bg-[linear-gradient(145deg,#e6e6e6,#ffffff)] shadow-[8px_8px_16px_#d1d1d1,-8px_-8px_16px_#ffffff] transition-all duration-300 ease-in-out hover:bg-[linear-gradient(145deg,#ffffff,#e6e6e6)] hover:shadow-[12px_12px_24px_#d1d1d1,-12px_-12px_24px_#ffffff] hover:-translate-y-0.5 active:shadow-[4px_4px_8px_#d1d1d1,-4px_-4px_8px_#ffffff] active:translate-y-px dark:bg-[linear-gradient(145deg,#2d2d2d,#3a3a3a)] dark:shadow-[8px_8px_16px_#121212,-8px_-8px_16px_#454545] dark:hover:bg-[linear-gradient(145deg,#3a3a3a,#2d2d2d)] dark:hover:shadow-[12px_12px_24px_#121212,-12px_-12px_24px_#454545] dark:active:shadow-[4px_4px_8px_#121212,-4px_-4px_8px_#454545]"
    aria-label="Toggle light and dark mode"
    title="Toggle theme"
  >
    <span id="themeToggleIcon" class="theme-toggle-icon transition-transform duration-300 ease-in-out dark:rotate-[15deg]" aria-hidden="true">🌙</span>
  </button>

  <div class="text-center">
    <button id="openModalBtn" class="clay-button text-gray-800 dark:text-gray-200 font-semibold py-4 px-8 rounded-2xl bg-[linear-gradient(145deg,#e6e6e6,#ffffff)] shadow-[8px_8px_16px_#d1d1d1,-8px_-8px_16px_#ffffff] transition-all duration-200 ease-in-out hover:bg-[linear-gradient(145deg,#ffffff,#e6e6e6)] hover:shadow-[12px_12px_24px_#d1d1d1,-12px_-12px_24px_#ffffff] hover:-translate-y-0.5 active:shadow-[4px_4px_8px_#d1d1d1,-4px_-4px_8px_#ffffff] active:translate-y-px dark:bg-[linear-gradient(145deg,#2d2d2d,#3a3a3a)] dark:shadow-[8px_8px_16px_#121212,-8px_-8px_16px_#454545] dark:hover:bg-[linear-gradient(145deg,#3a3a3a,#2d2d2d)] dark:hover:shadow-[12px_12px_24px_#121212,-12px_-12px_24px_#454545] dark:active:shadow-[4px_4px_8px_#121212,-4px_-4px_8px_#454545]">
      Open Contact Form
    </button>
  </div>

  <div id="overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50">
    <div id="modal" class="rounded-3xl p-8 w-full max-w-md clay-modal bg-[linear-gradient(145deg,#e6e6e6,#ffffff)] shadow-[12px_12px_24px_#d1d1d1,-12px_-12px_24px_#ffffff] dark:bg-[linear-gradient(145deg,#2d2d2d,#3a3a3a)] dark:shadow-[12px_12px_24px_#121212,-12px_-12px_24px_#454545]">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100 transition-colors duration-300">Contact Us</h2>
        <button id="closeModalBtn" class="text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-200 transition-colors duration-300">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <form id="contactForm" class="space-y-4">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1 transition-colors duration-300">Name</label>
          <input type="text" id="name" class="w-full rounded-xl px-4 py-3 outline-none clay-input bg-[linear-gradient(145deg,#e6e6e6,#ffffff)] shadow-[inset_4px_4px_8px_#d1d1d1,inset_-4px_-4px_8px_#ffffff] transition-all duration-200 ease-in-out focus:shadow-[inset_6px_6px_12px_#d1d1d1,inset_-6px_-6px_12px_#ffffff] dark:bg-[linear-gradient(145deg,#252525,#333333)] dark:shadow-[inset_4px_4px_8px_#121212,inset_-4px_-4px_8px_#404040] dark:text-[#e5e5e5] dark:placeholder:text-gray-400 dark:focus:shadow-[inset_6px_6px_12px_#121212,inset_-6px_-6px_12px_#404040]" placeholder="Your name">
        </div>
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1 transition-colors duration-300">Email</label>
          <input type="email" id="email" class="w-full rounded-xl px-4 py-3 outline-none clay-input bg-[linear-gradient(145deg,#e6e6e6,#ffffff)] shadow-[inset_4px_4px_8px_#d1d1d1,inset_-4px_-4px_8px_#ffffff] transition-all duration-200 ease-in-out focus:shadow-[inset_6px_6px_12px_#d1d1d1,inset_-6px_-6px_12px_#ffffff] dark:bg-[linear-gradient(145deg,#252525,#333333)] dark:shadow-[inset_4px_4px_8px_#121212,inset_-4px_-4px_8px_#404040] dark:text-[#e5e5e5] dark:placeholder:text-gray-400 dark:focus:shadow-[inset_6px_6px_12px_#121212,inset_-6px_-6px_12px_#404040]" placeholder="your@email.com">
        </div>
        <div>
          <label for="message" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1 transition-colors duration-300">Message</label>
          <textarea id="message" rows="4" class="w-full rounded-xl px-4 py-3 outline-none clay-input resize-none bg-[linear-gradient(145deg,#e6e6e6,#ffffff)] shadow-[inset_4px_4px_8px_#d1d1d1,inset_-4px_-4px_8px_#ffffff] transition-all duration-200 ease-in-out focus:shadow-[inset_6px_6px_12px_#d1d1d1,inset_-6px_-6px_12px_#ffffff] dark:bg-[linear-gradient(145deg,#252525,#333333)] dark:shadow-[inset_4px_4px_8px_#121212,inset_-4px_-4px_8px_#404040] dark:text-[#e5e5e5] dark:placeholder:text-gray-400 dark:focus:shadow-[inset_6px_6px_12px_#121212,inset_-6px_-6px_12px_#404040]" placeholder="Your message..."></textarea>
        </div>
        <button type="submit" class="w-full text-indigo-800 dark:text-indigo-100 font-semibold py-3 px-6 rounded-xl clay-submit bg-[linear-gradient(145deg,#c7d2fe,#e0e7ff)] shadow-[6px_6px_12px_#a5b4fc,-6px_-6px_12px_#eef2ff] transition-all duration-200 ease-in-out hover:bg-[linear-gradient(145deg,#e0e7ff,#c7d2fe)] hover:shadow-[8px_8px_16px_#a5b4fc,-8px_-8px_16px_#eef2ff] hover:-translate-y-px active:shadow-[3px_3px_6px_#a5b4fc,-3px_-3px_6px_#eef2ff] active:translate-y-px dark:bg-[linear-gradient(145deg,#3730a3,#4f46e5)] dark:shadow-[6px_6px_12px_#1e1b4b,-6px_-6px_12px_#6366f1] dark:hover:bg-[linear-gradient(145deg,#4f46e5,#3730a3)] dark:hover:shadow-[8px_8px_16px_#1e1b4b,-8px_-8px_16px_#6366f1] dark:active:shadow-[3px_3px_6px_#1e1b4b,-3px_-3px_6px_#6366f1]">
          Send Message
        </button>
      </form>
    </div>
  </div>

  <div id="messageOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-[60]">
    <div id="messageBox" class="clay-modal text-center w-[300px] max-w-[90%] p-4 rounded-xl shadow-[0_8px_32px_rgba(0,0,0,0.12),8px_8px_16px_#d1d1d1,-8px_-8px_16px_#ffffff] bg-[linear-gradient(145deg,#e6e6e6,#ffffff)] dark:bg-[linear-gradient(145deg,#2d2d2d,#3a3a3a)] dark:shadow-[0_8px_32px_rgba(0,0,0,0.4),8px_8px_16px_#121212,-8px_-8px_16px_#454545]">
      <p id="messageText" class="text-gray-800 dark:text-gray-200 transition-colors duration-300 text-[15px] leading-[1.5] max-w-full mx-auto break-words"></p>
      <button id="messageOkBtn" type="button" class="clay-button text-gray-800 dark:text-gray-200 bg-[linear-gradient(145deg,#e6e6e6,#ffffff)] transition-all duration-200 ease-in-out hover:bg-[linear-gradient(145deg,#ffffff,#e6e6e6)] hover:-translate-y-0.5 active:translate-y-px dark:bg-[linear-gradient(145deg,#2d2d2d,#3a3a3a)] dark:hover:bg-[linear-gradient(145deg,#3a3a3a,#2d2d2d)] py-[6px] px-[14px] text-sm font-semibold mt-2.5 rounded-[10px] shadow-[4px_4px_10px_#d1d1d1,-4px_-4px_10px_#ffffff] hover:shadow-[6px_6px_14px_#d1d1d1,-6px_-6px_14px_#ffffff] active:shadow-[2px_2px_6px_#d1d1d1,-2px_-2px_6px_#ffffff] dark:shadow-[4px_4px_10px_#121212,-4px_-4px_10px_#454545] dark:hover:shadow-[6px_6px_14px_#121212,-6px_-6px_14px_#454545] dark:active:shadow-[2px_2px_6px_#121212,-2px_-2px_6px_#454545]">
        OK
      </button>
    </div>
  </div>

  <footer
    class="clay-footer fixed bottom-0 left-0 z-10 w-full text-center py-3 text-sm backdrop-blur-md bg-white/70 dark:bg-black/50 text-gray-600 dark:text-gray-300 shadow-[0_-4px_16px_rgba(0,0,0,0.06),4px_-4px_8px_#d1d1d1,-4px_-4px_8px_#ffffff] transition-[color,box-shadow] duration-300 ease-in-out dark:shadow-[0_-4px_16px_rgba(0,0,0,0.25),4px_-4px_8px_#121212,-4px_-4px_8px_#454545]"
    role="contentinfo"
  >
    <p>© 2026 Krish| Built with ❤️ and Code | All Rights Reserved</p>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
